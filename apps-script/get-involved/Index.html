<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_blank">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       NARN — "The Relay" component theme (final, merged system)
       Shared drop-in styles for every NARN mini-app embed.
       Selectors listed in the brand contract are never renamed —
       new mini-apps may ADD classes but must reuse this exact set.
       ============================================================ */

    :root {
      /* ---- brand palette ---- */
      --primary: #1F3D2E;         /* deep forest ink — headings, dark UI, masthead */
      --primary-rgb: 31, 61, 46;
      --primaryDark: #12231A;     /* near-black forest — pressed states, id/count stamps */
      --primaryDark-rgb: 18, 35, 26;
      --accent: #C63F17;          /* flare-orange — primary CTA, urgent badge, focus ring */
      --accent-rgb: 198, 63, 23;
      --accent-pressed: #8A2C10;  /* struck-shadow shade under the primary button */
      --accentAlt: #C98A1D;       /* marigold gold — needed/in-progress signal, funding bars */
      --accentAlt-rgb: 201, 138, 29;
      --background: #F5EEDF;      /* warm parchment page ground */
      --surface: #FFFCF5;         /* warm ivory card/panel stock */
      --ink: #211C15;             /* true warm near-black — reading text, deliberately NOT green */
      --inkMuted: #5B5445;        /* warm taupe — meta, captions, fine print */
      --line: #D9C9A0;            /* warm khaki border — reads like cut cardstock, not a UI grey */

      /* ---- structural tokens ---- */
      --shadow: 0 20px 40px -18px rgba(18, 35, 26, .42), 0 2px 8px rgba(18, 35, 26, .08);
      --shadow-hover: 0 26px 48px -18px rgba(18, 35, 26, .5), 0 3px 10px rgba(18, 35, 26, .1);
      --radius: 10px;      /* cards, panels, filter bar, state blocks */
      --radius-sm: 6px;    /* buttons, inputs, badges, chips, id tags — sharper, "tag" scale */
    }

    * { box-sizing: border-box; }

    img { max-width: 100%; }

    ::selection { background: var(--accentAlt); color: var(--primaryDark); }

    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      color: var(--ink);
      background-color: var(--background);
      background-image: radial-gradient(rgba(33, 28, 21, .045) 1px, transparent 1.5px);
      background-size: 16px 16px;
      font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* Masthead stripe — the one graphic device every embedded NARN page shares,
       so a dozen separate Google Sites mini-apps still read as one product. */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accentAlt));
      z-index: 1000;
    }

    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 52px; }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 2px dashed var(--line);
    }

    h1 {
      position: relative;
      margin: 0 0 8px;
      padding-left: 20px;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-weight: 800;
      font-size: clamp(1.9rem, 4.2vw, 2.9rem);
      line-height: 1.06;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    h1::before {
      content: "";
      position: absolute;
      left: 0; top: 0.12em; bottom: 0.12em;
      width: 6px;
      border-radius: 2px;
      background: var(--accent);
    }

    .intro p { margin: 0; max-width: 700px; color: var(--inkMuted); font-size: 1.02rem; }

    .count {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      background: var(--primaryDark);
      color: #fff;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: .82rem;
      letter-spacing: .02em;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
    }

    /* ---------- Filters ---------- */

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      padding: 16px;
      margin-bottom: 26px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    label {
      display: grid;
      gap: 5px;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-size: .74rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    input, select {
      width: 100%;
      min-height: 43px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
    }
    input::placeholder { color: var(--inkMuted); opacity: .8; }
    input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), .35);
      outline-offset: 2px;
      border-color: var(--accent);
    }
    a:focus-visible, button:focus-visible, .tab:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), .35);
      outline-offset: 2px;
    }

    @media (max-width: 930px) {
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .intro { align-items: flex-start; flex-direction: column; }
      .filters { grid-template-columns: 1fr; }
    }

    /* ---------- Card grid ---------- */

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

    @media (max-width: 930px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

    .photo-wrap { position: relative; aspect-ratio: 4 / 3; background: var(--line); overflow: hidden; }
    .photo { width: 100%; height: 100%; display: block; object-fit: cover; }
    .photo-fallback {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: var(--primary);
      font-size: 3.4rem;
      background: linear-gradient(160deg, var(--line), var(--background));
    }

    /* Clipped "luggage tag" corner — the identity's signature shape, tying every
       status badge back to the relay/manifest metaphor instead of a generic pill. */
    .badge {
      position: absolute;
      top: 12px; left: 12px;
      padding: 6px 12px 6px 10px;
      background: var(--primaryDark);
      color: #fff;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    .badge.urgent { background: var(--accent); }
    .badge.needed { background: var(--accentAlt); color: var(--primaryDark); }

    .body { padding: 18px; flex: 1; display: flex; flex-direction: column; }

    .title-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

    h2 {
      margin: 0;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.42rem;
      line-height: 1.15;
    }

    .id {
      white-space: nowrap;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: .72rem;
      font-weight: 500;
      color: var(--inkMuted);
      background: var(--background);
      border: 1px solid var(--line);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .meta { margin: 7px 0 12px; color: var(--inkMuted); font-size: .93rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      background: rgba(var(--primary-rgb), .08);
      border: 1px solid rgba(var(--primary-rgb), .18);
      color: var(--primary);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .description {
      display: -webkit-box;
      overflow: hidden;
      min-height: 4.5em;
      margin: 0 0 12px;
      color: var(--ink);
      font-size: .95rem;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .compatibility { margin: 0 0 13px; font-size: .82rem; color: var(--inkMuted); }

    .verified {
      margin: 0 0 14px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: .72rem;
      letter-spacing: .02em;
      color: var(--inkMuted);
    }

    /* Dashed "tear line" above actions — you tear the stub and go. */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 2px dashed var(--line);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 42px;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      border: 2px solid transparent;
      text-decoration: none;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-weight: 700;
      font-size: .94rem;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .12s ease, box-shadow .12s ease;
    }

    /* Primary reads like a stamped, pressable badge rather than a soft app glow. */
    .button.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 3px 0 var(--accent-pressed);
    }
    .button.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--accent-pressed); }
    .button.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-pressed); }

    .button.secondary { color: var(--primary); background: var(--surface); border-color: var(--primary); }
    .button.secondary:hover { background: rgba(var(--primary-rgb), .06); }
    .button.secondary:active { transform: translateY(1px); }

    .state {
      grid-column: 1 / -1;
      padding: 40px 20px;
      text-align: center;
      background: var(--surface);
      border: 2px dashed var(--line);
      border-radius: var(--radius);
    }
    .state strong {
      display: block;
      margin-bottom: 4px;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.15rem;
    }
    .state span { color: var(--inkMuted); }
    .state.error { border-style: solid; border-color: rgba(var(--accent-rgb), .4); }
    .state.error strong { color: var(--accent-pressed); }

    /* ============================================================
       Additions for mini-apps beyond the dog directory
       ============================================================ */

    /* Funding / goal progress */
    .progress-bar {
      width: 100%;
      height: 10px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accentAlt));
      border-radius: inherit;
      transition: width .3s ease;
    }

    /* Volunteer role cards */
    .role-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accentAlt);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .role-card h3 {
      margin: 0 0 6px;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.2rem;
    }

    /* Simple tabbed pages */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--line);
    }
    .tab {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 10px 16px;
      margin-bottom: -2px;
      color: var(--inkMuted);
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-weight: 700;
      font-size: .92rem;
      cursor: pointer;
    }
    .tab:hover { color: var(--primary); }
    .tab.active, .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--accent); }

    /* ---------- Get Involved page additions ---------- */

    .role-card { gap: 10px; }
    .role-card .commitment {
      display: inline-flex;
      align-self: flex-start;
      background: rgba(var(--accentAlt-rgb), .16);
      color: var(--primaryDark);
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: var(--radius-sm);
    }
    .role-card p.description {
      -webkit-line-clamp: initial;
      min-height: 0;
    }
    .role-card .actions {
      margin-top: 4px;
      padding-top: 14px;
    }

    .needs-section {
      margin-bottom: 30px;
    }
    .needs-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-size: .78rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .needs-heading::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .18);
      flex: none;
    }
    .needs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .need-card {
      background: var(--surface);
      border: 1px solid rgba(var(--accent-rgb), .35);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .need-card .need-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .need-card h3 {
      margin: 0;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .need-card .need-state {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: .72rem;
      font-weight: 600;
      color: var(--inkMuted);
      white-space: nowrap;
    }
    .need-card p {
      margin: 0 0 6px;
      font-size: .9rem;
      color: var(--ink);
    }
    .need-card .verified { margin: 0; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Get involved</h1>
        <p>Nine ways to work a leg of the relay. Pick the role that matches your time, your skills, and your location, then apply — we'll route you from there.</p>
      </div>
      <div id="count" class="count" aria-live="polite">Loading…</div>
    </section>

    <section id="needs-section" class="needs-section" hidden aria-labelledby="needs-heading">
      <p id="needs-heading" class="needs-heading">Urgently needed right now</p>
      <div id="needs-grid" class="needs-grid" aria-live="polite"></div>
    </section>

    <section id="roles" class="grid" aria-live="polite" aria-busy="true">
      <div class="state"><strong>Loading roles…</strong></div>
    </section>
  </main>

  <script>
    'use strict';
    const rolesEl = document.getElementById('roles');
    const countEl = document.getElementById('count');
    const needsSection = document.getElementById('needs-section');
    const needsGrid = document.getElementById('needs-grid');

    google.script.run
      .withSuccessHandler(data => {
        const roles = Array.isArray(data && data.roles) ? data.roles : [];
        const needs = Array.isArray(data && data.needs) ? data.needs : [];

        renderNeeds(needs);
        renderRoles(roles);
      })
      .withFailureHandler(error => {
        rolesEl.setAttribute('aria-busy', 'false');
        rolesEl.replaceChildren(message('The role board could not be loaded.', error && error.message, true));
        countEl.textContent = 'Unavailable';
      })
      .getRoleBoardData();

    function renderNeeds(needs) {
      if (!needs.length) {
        needsSection.hidden = true;
        return;
      }
      needsSection.hidden = false;
      needsGrid.replaceChildren();
      needs.forEach(need => needsGrid.appendChild(needCard(need)));
    }

    function needCard(need) {
      const card = element('article', 'need-card');
      const top = element('div', 'need-top');
      top.appendChild(element('h3', '', need.role || 'Role needed'));
      if (need.state) top.appendChild(element('span', 'need-state', need.state));
      card.appendChild(top);
      if (need.note) card.appendChild(element('p', '', need.note));
      if (need.lastVerified) card.appendChild(element('p', 'verified', 'Last verified: ' + need.lastVerified));
      return card;
    }

    function renderRoles(roles) {
      rolesEl.setAttribute('aria-busy', 'false');
      countEl.textContent = roles.length + (roles.length === 1 ? ' role' : ' roles');
      rolesEl.replaceChildren();
      if (!roles.length) {
        rolesEl.appendChild(message('No roles are listed right now.', 'Check back soon, or contact the network directly.'));
        return;
      }
      roles.forEach(role => rolesEl.appendChild(roleCard(role)));
    }

    function roleCard(role) {
      const article = element('article', 'card role-card');
      article.appendChild(element('h3', '', role.title));
      if (role.commitment) article.appendChild(element('span', 'commitment', role.commitment));
      article.appendChild(element('p', 'description', role.description));

      const actions = element('div', 'actions');
      if (role.applyUrl) actions.appendChild(link('Apply for this role', role.applyUrl, 'primary'));
      article.appendChild(actions);
      return article;
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function link(text, url, kind) {
      const anchor = element('a', 'button ' + kind, text);
      anchor.href = url;
      anchor.rel = 'noopener noreferrer';
      anchor.target = '_blank';
      return anchor;
    }

    function message(title, detail, isError) {
      const box = element('div', 'state' + (isError ? ' error' : ''));
      box.appendChild(element('strong', '', title));
      if (detail) box.appendChild(element('span', '', detail));
      return box;
    }
  </script>
</body>
</html>
