<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_blank">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       NARN — "The Relay" component theme (final, merged system)
       Shared drop-in styles for every NARN mini-app embed.
       Selectors listed in the brand contract are never renamed —
       new mini-apps may ADD classes but must reuse this exact set.
       ============================================================ */

    :root {
      /* ---- brand palette ---- */
      --primary: #1F3D2E;         /* deep forest ink — headings, dark UI, masthead */
      --primary-rgb: 31, 61, 46;
      --primaryDark: #12231A;     /* near-black forest — pressed states, id/count stamps */
      --primaryDark-rgb: 18, 35, 26;
      --accent: #C63F17;          /* flare-orange — primary CTA, urgent badge, focus ring */
      --accent-rgb: 198, 63, 23;
      --accent-pressed: #8A2C10;  /* struck-shadow shade under the primary button */
      --accentAlt: #C98A1D;       /* marigold gold — needed/in-progress signal, funding bars */
      --accentAlt-rgb: 201, 138, 29;
      --background: #F5EEDF;      /* warm parchment page ground */
      --surface: #FFFCF5;         /* warm ivory card/panel stock */
      --ink: #211C15;             /* true warm near-black — reading text, deliberately NOT green */
      --inkMuted: #5B5445;        /* warm taupe — meta, captions, fine print */
      --line: #D9C9A0;            /* warm khaki border — reads like cut cardstock, not a UI grey */

      /* ---- structural tokens ---- */
      --shadow: 0 20px 40px -18px rgba(18, 35, 26, .42), 0 2px 8px rgba(18, 35, 26, .08);
      --shadow-hover: 0 26px 48px -18px rgba(18, 35, 26, .5), 0 3px 10px rgba(18, 35, 26, .1);
      --radius: 10px;      /* cards, panels, filter bar, state blocks */
      --radius-sm: 6px;    /* buttons, inputs, badges, chips, id tags — sharper, "tag" scale */
    }

    * { box-sizing: border-box; }

    img { max-width: 100%; }

    ::selection { background: var(--accentAlt); color: var(--primaryDark); }

    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      color: var(--ink);
      background-color: var(--background);
      background-image: radial-gradient(rgba(33, 28, 21, .045) 1px, transparent 1.5px);
      background-size: 16px 16px;
      font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* Masthead stripe — the one graphic device every embedded NARN page shares,
       so a dozen separate Google Sites mini-apps still read as one product. */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accentAlt));
      z-index: 1000;
    }

    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 52px; }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 2px dashed var(--line);
    }

    h1 {
      position: relative;
      margin: 0 0 8px;
      padding-left: 20px;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-weight: 800;
      font-size: clamp(1.9rem, 4.2vw, 2.9rem);
      line-height: 1.06;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    h1::before {
      content: "";
      position: absolute;
      left: 0; top: 0.12em; bottom: 0.12em;
      width: 6px;
      border-radius: 2px;
      background: var(--accent);
    }

    .intro p { margin: 0; max-width: 700px; color: var(--inkMuted); font-size: 1.02rem; }

    .count {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      background: var(--primaryDark);
      color: #fff;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: .82rem;
      letter-spacing: .02em;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
    }

    /* ---------- Filters ---------- */

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      padding: 16px;
      margin-bottom: 26px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    label {
      display: grid;
      gap: 5px;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-size: .74rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    input, select {
      width: 100%;
      min-height: 43px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
    }
    input::placeholder { color: var(--inkMuted); opacity: .8; }
    input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), .35);
      outline-offset: 2px;
      border-color: var(--accent);
    }
    a:focus-visible, button:focus-visible, .tab:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), .35);
      outline-offset: 2px;
    }

    @media (max-width: 930px) {
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .intro { align-items: flex-start; flex-direction: column; }
      .filters { grid-template-columns: 1fr; }
    }

    /* ---------- Card grid ---------- */

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

    @media (max-width: 930px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

    .photo-wrap { position: relative; aspect-ratio: 4 / 3; background: var(--line); overflow: hidden; }
    .photo { width: 100%; height: 100%; display: block; object-fit: cover; }
    .photo-fallback {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: var(--primary);
      font-size: 3.4rem;
      background: linear-gradient(160deg, var(--line), var(--background));
    }

    /* Clipped "luggage tag" corner — the identity's signature shape, tying every
       status badge back to the relay/manifest metaphor instead of a generic pill. */
    .badge {
      position: absolute;
      top: 12px; left: 12px;
      padding: 6px 12px 6px 10px;
      background: var(--primaryDark);
      color: #fff;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    .badge.urgent { background: var(--accent); }
    .badge.needed { background: var(--accentAlt); color: var(--primaryDark); }

    .body { padding: 18px; flex: 1; display: flex; flex-direction: column; }

    .title-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

    h2 {
      margin: 0;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.42rem;
      line-height: 1.15;
    }

    .id {
      white-space: nowrap;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: .72rem;
      font-weight: 500;
      color: var(--inkMuted);
      background: var(--background);
      border: 1px solid var(--line);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .meta { margin: 7px 0 12px; color: var(--inkMuted); font-size: .93rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      background: rgba(var(--primary-rgb), .08);
      border: 1px solid rgba(var(--primary-rgb), .18);
      color: var(--primary);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .description {
      display: -webkit-box;
      overflow: hidden;
      min-height: 4.5em;
      margin: 0 0 12px;
      color: var(--ink);
      font-size: .95rem;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .compatibility { margin: 0 0 13px; font-size: .82rem; color: var(--inkMuted); }

    .verified {
      margin: 0 0 14px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: .72rem;
      letter-spacing: .02em;
      color: var(--inkMuted);
    }

    /* Dashed "tear line" above actions — you tear the stub and go. */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 2px dashed var(--line);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 42px;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      border: 2px solid transparent;
      text-decoration: none;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-weight: 700;
      font-size: .94rem;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .12s ease, box-shadow .12s ease;
    }

    /* Primary reads like a stamped, pressable badge rather than a soft app glow. */
    .button.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 3px 0 var(--accent-pressed);
    }
    .button.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--accent-pressed); }
    .button.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-pressed); }

    .button.secondary { color: var(--primary); background: var(--surface); border-color: var(--primary); }
    .button.secondary:hover { background: rgba(var(--primary-rgb), .06); }
    .button.secondary:active { transform: translateY(1px); }

    .state {
      grid-column: 1 / -1;
      padding: 40px 20px;
      text-align: center;
      background: var(--surface);
      border: 2px dashed var(--line);
      border-radius: var(--radius);
    }
    .state strong {
      display: block;
      margin-bottom: 4px;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.15rem;
    }
    .state span { color: var(--inkMuted); }
    .state.error { border-style: solid; border-color: rgba(var(--accent-rgb), .4); }
    .state.error strong { color: var(--accent-pressed); }

    /* ============================================================
       Additions for mini-apps beyond the dog directory
       ============================================================ */

    /* Funding / goal progress */
    .progress-bar {
      width: 100%;
      height: 10px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accentAlt));
      border-radius: inherit;
      transition: width .3s ease;
    }

    /* Volunteer role cards */
    .role-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accentAlt);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .role-card h3 {
      margin: 0 0 6px;
      color: var(--primary);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.2rem;
    }

    /* Simple tabbed pages */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--line);
    }
    .tab {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 10px 16px;
      margin-bottom: -2px;
      color: var(--inkMuted);
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-weight: 700;
      font-size: .92rem;
      cursor: pointer;
    }
    .tab:hover { color: var(--primary); }
    .tab.active, .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--accent); }

    /* ---------- Give hub page additions ---------- */

    /* Unlike an Artifact-hosted page, this standalone Apps Script page gets
       no host-injected reset, so the `hidden` attribute needs an explicit
       rule here to beat each panel's own `.grid { display: grid }` — author
       CSS otherwise outranks the browser's default `[hidden]` UA style. */
    [hidden] { display: none !important; }

    .milestone-note {
      margin: 0;
      padding: 10px 12px;
      background: rgba(var(--accentAlt-rgb), .14);
      border-left: 3px solid var(--accentAlt);
      border-radius: 4px;
      color: var(--ink);
      font-size: .88rem;
    }

    .progress-line { margin: 0 0 12px; color: var(--inkMuted); font-size: .88rem; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Give</h1>
        <p>Pick a fund that matches the job, ship something straight off an open wishlist, or back a project we're building toward. No sign-in, no middleman — every link below goes straight to the ask.</p>
      </div>
      <div id="count" class="count" aria-live="polite">Loading…</div>
    </section>

    <div class="tabs" role="tablist" aria-label="Give hub sections">
      <button class="tab" role="tab" type="button" id="tab-funds" aria-selected="true" aria-controls="panel-funds" tabindex="0">Where your gift goes</button>
      <button class="tab" role="tab" type="button" id="tab-wishlists" aria-selected="false" aria-controls="panel-wishlists" tabindex="-1">Amazon wishlists</button>
      <button class="tab" role="tab" type="button" id="tab-projects" aria-selected="false" aria-controls="panel-projects" tabindex="-1">Future projects</button>
    </div>

    <section id="panel-funds" class="grid" role="tabpanel" aria-labelledby="tab-funds" aria-live="polite" aria-busy="true">
      <div class="state"><strong>Loading funds…</strong></div>
    </section>

    <section id="panel-wishlists" class="grid" role="tabpanel" aria-labelledby="tab-wishlists" aria-live="polite" aria-busy="true" hidden>
      <div class="state"><strong>Loading wishlists…</strong></div>
    </section>

    <section id="panel-projects" class="grid" role="tabpanel" aria-labelledby="tab-projects" aria-live="polite" aria-busy="true" hidden>
      <div class="state"><strong>Loading projects…</strong></div>
    </section>
  </main>

  <script>
    'use strict';

    const tabOrder = ['funds', 'wishlists', 'projects'];
    const tabs = {
      funds: document.getElementById('tab-funds'),
      wishlists: document.getElementById('tab-wishlists'),
      projects: document.getElementById('tab-projects')
    };
    const panels = {
      funds: document.getElementById('panel-funds'),
      wishlists: document.getElementById('panel-wishlists'),
      projects: document.getElementById('panel-projects')
    };
    const countEl = document.getElementById('count');
    const data = { funds: [], wishlists: [], projects: [] };
    let activeTab = 'funds';

    tabOrder.forEach(key => {
      tabs[key].addEventListener('click', () => activateTab(key));
    });

    document.querySelector('.tabs').addEventListener('keydown', event => {
      if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
      event.preventDefault();
      const currentIndex = tabOrder.indexOf(activeTab);
      const delta = event.key === 'ArrowRight' ? 1 : -1;
      const nextKey = tabOrder[(currentIndex + delta + tabOrder.length) % tabOrder.length];
      activateTab(nextKey);
      tabs[nextKey].focus();
    });

    function activateTab(key) {
      activeTab = key;
      tabOrder.forEach(k => {
        const isActive = k === key;
        tabs[k].setAttribute('aria-selected', String(isActive));
        tabs[k].tabIndex = isActive ? 0 : -1;
        panels[k].hidden = !isActive;
      });
      updateCount();
    }

    function updateCount() {
      const label = { funds: 'fund', wishlists: 'wishlist', projects: 'project' }[activeTab];
      const items = data[activeTab];
      countEl.textContent = items.length + ' ' + (items.length === 1 ? label : label + 's');
    }

    google.script.run
      .withSuccessHandler(result => {
        data.funds = Array.isArray(result && result.funds) ? result.funds : [];
        data.wishlists = Array.isArray(result && result.wishlists) ? result.wishlists : [];
        data.projects = Array.isArray(result && result.projects) ? result.projects : [];

        renderFunds(data.funds);
        renderWishlists(data.wishlists);
        renderProjects(data.projects);
        updateCount();
      })
      .withFailureHandler(error => {
        tabOrder.forEach(key => {
          panels[key].setAttribute('aria-busy', 'false');
          panels[key].replaceChildren(message('This section could not be loaded.', error && error.message, true));
        });
        countEl.textContent = 'Unavailable';
      })
      .getGiveHubData();

    function renderFunds(funds) {
      panels.funds.setAttribute('aria-busy', 'false');
      panels.funds.replaceChildren();
      if (!funds.length) {
        panels.funds.appendChild(message('No give funds are listed right now.', 'Check back soon.'));
        return;
      }
      funds.forEach(fund => panels.funds.appendChild(fundCard(fund)));
    }

    function fundCard(fund) {
      const article = element('article', 'card');
      const body = element('div', 'body');
      body.appendChild(element('h2', '', fund.name || 'Give fund'));
      body.appendChild(element('p', 'description', fund.description || 'Details on request.'));

      const actions = element('div', 'actions');
      if (isHttps(fund.donateUrl)) actions.appendChild(link('Give to ' + (fund.name || 'this fund'), fund.donateUrl, 'primary'));
      if (actions.childNodes.length) body.appendChild(actions);

      article.appendChild(body);
      return article;
    }

    function renderWishlists(wishlists) {
      panels.wishlists.setAttribute('aria-busy', 'false');
      panels.wishlists.replaceChildren();
      if (!wishlists.length) {
        panels.wishlists.appendChild(message('No wishlists are posted right now.', 'Check back soon.'));
        return;
      }
      wishlists.forEach(item => panels.wishlists.appendChild(wishlistCard(item)));
    }

    function wishlistCard(item) {
      const article = element('article', 'card');
      const body = element('div', 'body');
      body.appendChild(element('h2', '', item.programOrPartner || 'Partner wishlist'));
      if (item.destination) body.appendChild(element('p', 'meta', item.destination));
      body.appendChild(element('p', 'description', item.priorityNeeds || 'Priority needs on request.'));
      if (item.lastVerified) body.appendChild(element('p', 'verified', 'Last verified: ' + item.lastVerified));

      const actions = element('div', 'actions');
      if (isHttps(item.wishlistUrl)) actions.appendChild(link('View wishlist', item.wishlistUrl, 'primary'));
      if (actions.childNodes.length) body.appendChild(actions);

      article.appendChild(body);
      return article;
    }

    function renderProjects(projects) {
      panels.projects.setAttribute('aria-busy', 'false');
      panels.projects.replaceChildren();
      if (!projects.length) {
        panels.projects.appendChild(message('No future projects are posted right now.', 'Check back soon.'));
        return;
      }
      projects.forEach(project => panels.projects.appendChild(projectCard(project)));
    }

    function projectCard(project) {
      const article = element('article', 'card');
      const body = element('div', 'body');
      body.appendChild(element('h2', '', project.name || 'Future project'));
      body.appendChild(element('p', 'description', project.description || 'Details on request.'));

      const percent = clampPercent(project.percent);
      const bar = element('div', 'progress-bar');
      const fill = element('div', 'progress-fill');
      fill.style.width = percent + '%';
      bar.appendChild(fill);
      body.appendChild(bar);

      body.appendChild(element('p', 'progress-line', progressLine(project, percent)));

      if (project.milestoneNote) {
        body.appendChild(element('p', 'milestone-note', project.milestoneNote));
      }

      article.appendChild(body);
      return article;
    }

    function progressLine(project, percent) {
      const goal = Number(project.goalAmount) || 0;
      const raised = Number(project.raisedAmount) || 0;
      if (goal > 0) {
        return formatCurrency(raised) + ' raised of ' + formatCurrency(goal) + ' goal — ' + percent + '%';
      }
      if (raised > 0) {
        return formatCurrency(raised) + ' raised so far';
      }
      return 'Funding details coming soon.';
    }

    function clampPercent(value) {
      const number = Number(value);
      if (isNaN(number)) return 0;
      return Math.min(100, Math.max(0, Math.round(number)));
    }

    function formatCurrency(amount) {
      return '$' + Math.round(amount).toLocaleString('en-US');
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function link(text, url, kind) {
      const anchor = element('a', 'button ' + kind, text);
      anchor.href = url;
      anchor.rel = 'noopener noreferrer';
      anchor.target = '_blank';
      return anchor;
    }

    function isHttps(url) {
      return typeof url === 'string' && /^https:\/\//i.test(url);
    }

    function message(title, detail, isError) {
      const box = element('div', 'state' + (isError ? ' error' : ''));
      box.appendChild(element('strong', '', title));
      if (detail) box.appendChild(element('span', '', detail));
      return box;
    }
  </script>
</body>
</html>
